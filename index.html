function matchMenus(ids) {
  return MENUS.map(m => {
    const matched = m.needs.filter(n => ids.includes(n)).length;
    const pct = Math.round((matched / m.needs.length) * 100);
    return {...m, match: pct};
  }).filter(m => m.match >= 50).sort((a,b) => b.match - a.match);
}

// ===== หน้าล็อกอิน =====
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [errors, setErrors] = useState({ email:"", password:"" });

  const isValidEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

  const handleSubmit = () => {
    const trimmed = email.trim();
    const nextErrors = { email:"", password:"" };

    if (trimmed === "") nextErrors.email = "กรอกอีเมลของคุณก่อนนะครับ";
    else if (!isValidEmail(trimmed)) nextErrors.email = "รูปแบบอีเมลไม่ถูกต้อง";

    if (password === "") nextErrors.password = "กรอกรหัสผ่านของคุณก่อนนะครับ";
    else if (password.length < 6) nextErrors.password = "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";

    setErrors(nextErrors);
    if (nextErrors.email || nextErrors.password) return;
    onLogin(trimmed);
  };

  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", padding:"40px 28px", boxSizing:"border-box" }}>
      <div style={{ textAlign:"center", marginBottom:36 }}>
        <div style={{ width:64, height:64, borderRadius:18, background:`linear-gradient(135deg,${P},${PD})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:30, margin:"0 auto 16px" }}>🍳</div>
        <div style={{ fontSize:22, fontWeight:800, color:C.text }}>ครัวสิ้นคิด</div>
        <div style={{ fontSize:13, color:C.sub, marginTop:6 }}>เข้าสู่ระบบด้วยอีเมลเพื่อเริ่มใช้งาน</div>
      </div>

      <div style={{ fontSize:12.5, fontWeight:700, color:C.sub, marginBottom:8 }}>อีเมล</div>
      <div style={{ position:"relative", marginBottom:6 }}>
        <Mail size={16} color={C.faint} style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)" }} />
        <input
          type="email"
          value={email}
          onChange={e=>{ setEmail(e.target.value); if (errors.email) setErrors(p=>({...p, email:""})); }}
          onKeyDown={e=>{ if (e.key==="Enter") handleSubmit(); }}
          placeholder="name@example.com"
          style={{ width:"100%", background:C.card, border:`1px solid ${errors.email ? "#E24B4A" : C.border}`, borderRadius:12, padding:"13px 14px 13px 38px", fontSize:13.5, color:C.text, outline:"none", fontFamily:"inherit", boxSizing:"border-box" }}
        />
      </div>
      {errors.email && <div style={{ fontSize:12, color:"#F87171", marginBottom:10 }}>{errors.email}</div>}

      <div style={{ fontSize:12.5, fontWeight:700, color:C.sub, marginTop: errors.email ? 4 : 14, marginBottom:8 }}>รหัสผ่าน</div>
      <div style={{ position:"relative", marginBottom:6 }}>
        <Lock size={16} color={C.faint} style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)" }} />
        <input
          type={showPw ? "text" : "password"}
          value={password}
          onChange={e=>{ setPassword(e.target.value); if (errors.password) setErrors(p=>({...p, password:""})); }}
          onKeyDown={e=>{ if (e.key==="Enter") handleSubmit(); }}
          placeholder="อย่างน้อย 6 ตัวอักษร"
          style={{ width:"100%", background:C.card, border:`1px solid ${errors.password ? "#E24B4A" : C.border}`, borderRadius:12, padding:"13px 40px 13px 38px", fontSize:13.5, color:C.text, outline:"none", fontFamily:"inherit", boxSizing:"border-box" }}
        />
        <button type="button" onClick={()=>setShowPw(p=>!p)} style={{ position:"absolute", right:10, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", cursor:"pointer", color:C.faint, padding:6, display:"flex" }}>
          {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
        </button>
      </div>
      {errors.password && <div style={{ fontSize:12, color:"#F87171", marginBottom:10 }}>{errors.password}</div>}

      <button onClick={handleSubmit} style={{ marginTop:16, width:"100%", background:`linear-gradient(135deg,${P},${PD})`, color:"#fff", border:"none", borderRadius:14, padding:"14px", fontSize:14.5, fontWeight:800, cursor:"pointer", fontFamily:"inherit", boxShadow:"0 8px 24px rgba(90,76,219,.35)" }}>
        เข้าสู่ระบบ
      </button>

      <div style={{ fontSize:11.5, color:C.faint, textAlign:"center", marginTop:24, lineHeight:1.8 }}>
        🍳 ครัวสิ้นคิด — โครงงานวิชาการออกแบบและเทคโนโลยี (ว30182)<br/>ชั้นมัธยมศึกษาปีที่ 6
      </div>
    </div>
  );
}

function App() {
  const [userEmail, setUserEmail] = useState(null);
  const [tab, setTab] = useState("home");
  const [screen, setScreen] = useState("search");
  const [prevScreen, setPrevScreen] = useState("search");

  const [selected, setSelected] = useState([]);
  const [cat, setCat] = useState("ทั้งหมด");
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [activeMenu, setActiveMenu] = useState(null);

  const [favorites, setFavorites] = useState(() => {
    try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; }
  });
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  });

  useEffect(() => { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); }, [favorites]);
  useEffect(() => { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }, [history]);

  const toggleIngredient = (ing) => setSelected(p => p.find(x=>x.id===ing.id) ? p.filter(x=>x.id!==ing.id) : [...p,ing]);
  const clearAll = () => setSelected([]);

  const toggleFav = (name) => setFavorites(p => p.includes(name) ? p.filter(n=>n!==name) : [...p,name]);

  const handleSearch = () => {
    const ids = selected.map(i=>i.id);
    setResults(matchMenus(ids));
    setScreen("results");
  };

  const openMenu = (m, from) => {
    setActiveMenu(m);
    setPrevScreen(from);
    setScreen("detail");
    setHistory(p => [m.name, ...p.filter(n=>n!==m.name)].slice(0,20));
  };

  const openFromFav = (m) => { setTab("home"); openMenu(m, "results-noop"); };

  const changeTab = (t) => {
    setTab(t);
    if (t === "home") setScreen("search");
  };

  const selectedLabels = useMemo(()=>selected.map(s=>s.label), [selected]);

  let body;
  if (tab === "home") {
    if (screen === "search") {
      body = <SearchScreen selected={selected} toggle={toggleIngredient} clearAll={clearAll} cat={cat} setCat={setCat} query={query} setQuery={setQuery} onSearch={handleSearch} />;
    } else if (screen === "results") {
      body = <ResultsScreen results={results} selectedLabels={selectedLabels} onBack={()=>setScreen("search")} onOpen={(m)=>openMenu(m,"results")} favorites={favorites} toggleFav={toggleFav} />;
    } else {
      body = <DetailScreen menu={activeMenu} onBack={()=>setScreen(prevScreen==="results" ? "results" : "search")} isFav={favorites.includes(activeMenu.name)} onToggleFav={toggleFav} />;
    }
  } else if (tab === "favorites") {
    body = <FavoritesScreen favorites={favorites} toggleFav={toggleFav} onOpen={openFromFav} />;
  } else if (tab === "history") {
    body = <HistoryScreen history={history} onOpen={openFromFav} />;
  } else {
    body = <ProfileScreen favCount={favorites.length} historyCount={history.length} email={userEmail} onLogout={()=>setUserEmail(null)} />;
  }

  if (!userEmail) {
    return (
      <div style={{ background:"#000", minHeight:"100vh", display:"flex", justifyContent:"center", fontFamily:"'Noto Sans Thai','Sarabun',sans-serif" }}>
        <div style={{ width:PHONE_W, maxWidth:"100vw", minHeight:"100vh", background:C.bg }}>
          <LoginScreen onLogin={setUserEmail} />
        </div>
      </div>
    );
  }

  return (
    <div style={{ background:"#000", minHeight:"100vh", display:"flex", justifyContent:"center", fontFamily:"'Noto Sans Thai','Sarabun',sans-serif" }}>
      <div style={{ width:PHONE_W, maxWidth:"100vw", minHeight:"100vh", background:C.bg, position:"relative", paddingBottom:70 }}>
        {body}
        <BottomNav tab={tab} setTab={changeTab} />
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
